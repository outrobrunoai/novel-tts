name: Release
# Pushing a v* tag builds the artifacts and opens a DRAFT release for review.
# Re-running for the same tag fails at signing: AMO accepts one signature per version.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '24', cache: npm}
      - run: python -m pip install ruff==0.16.10
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tag matches the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c "import json; print(json.load(open('manifest.json', encoding='utf-8'))['version'])")"
          test "$TAG" = "v$version"
      - run: ./scripts/verify.sh
      - run: python3 scripts/package_release.py --output dist
      - run: python3 scripts/inspect_release.py --directory dist
      - name: Detect AMO credentials
        id: amo
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
        run: echo "configured=${AMO_JWT_ISSUER:+true}" >> "$GITHUB_OUTPUT"
      - name: Sign for self-distribution (AMO unlisted)
        if: steps.amo.outputs.configured == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          extension="$(python3 scripts/release_asset.py extension dist)"
          mkdir "$RUNNER_TEMP/ext" "$RUNNER_TEMP/signed"
          python3 -c 'import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "dist/$extension" "$RUNNER_TEMP/ext"
          npx --no-install web-ext sign --channel unlisted --source-dir "$RUNNER_TEMP/ext" --artifacts-dir "$RUNNER_TEMP/signed"
          set -- "$RUNNER_TEMP"/signed/*.xpi
          test "$#" -eq 1
          signed="${extension%.zip}.xpi"
          cp "$1" "dist/$signed"
          (cd dist && sha256sum "$signed" >> SHA256SUMS)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --draft --title "Novel TTS $TAG" --notes-file RELEASE_NOTES.md
